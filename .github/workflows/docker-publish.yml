name: Build and Push to Quay.io

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  workflow_dispatch: # Allows manual trigger

env:
  REGISTRY: quay.io
  IMAGE_NAME: openai-chat-ng
  QUAY_REPO: mklaasse

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # Permissions required for writing to the GITHUB_TOKEN for OIDC or repository access
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
        
      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build and push multi-arch container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.QUAY_REPO }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.QUAY_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Echo Image URL
        run: echo "Image pushed to ${{ env.REGISTRY }}/${{ env.QUAY_REPO }}/${{ env.IMAGE_NAME }}:latest"
