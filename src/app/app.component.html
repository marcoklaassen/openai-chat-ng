<div style="padding: 20px; max-width: 600px; margin: auto; font-family: sans-serif;">
  <h1>{{ title }}</h1>
  <hr>

  <h2>API Configuration ⚙️</h2>
  
  <!-- 🔗 Input field for the API URL -->
  <label for="apiUrlInput" style="display: block; margin-top: 10px; font-weight: bold; color: #333;">API URL (e.g., https://litellm-litemaas.apps.prod.rhoai.rh-aiservices-bu.com)</label>
  <input
    id="apiUrlInput"
    type="text"
    [(ngModel)]="apiUrl"
    placeholder="Enter the full API endpoint URL..."
    style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px;"
    [disabled]="isLoading || isModelListLoading"
  />

  <!-- 🔑 API Key input -->
  <label for="apiKeyInput" style="display: block; margin-top: 10px; font-weight: bold; color: #333;">Bearer Token / API Key</label>
  <input
    id="apiKeyInput"
    type="password"
    [(ngModel)]="apiKey"
    placeholder="Enter your Bearer Token here..."
    style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px;"
    [disabled]="isLoading || isModelListLoading"
  />

  <!-- Fetch Models Button -->
  <button 
    (click)="fetchModels()" 
    [disabled]="!apiKey.trim() || !apiUrl.trim() || isModelListLoading || isLoading"
    style="background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; transition: background-color 0.3s;"
    onmouseover="this.style.backgroundColor='#0056b3'"
    onmouseout="this.style.backgroundColor='#007bff'">
    <span *ngIf="!isModelListLoading">Fetch Available Models</span>
    <span *ngIf="isModelListLoading">Loading Models...</span>
  </button>
  
  <div style="margin-top: 20px;">
    <!-- 🧠 Model Selection Dropdown -->
    <label for="modelSelect" style="display: block; font-weight: bold; color: #333;">Select Model ({{ availableModels.length }} found):</label>
    <select
      id="modelSelect"
      [(ngModel)]="selectedModel"
      [disabled]="availableModels.length === 0 || isLoading || isModelListLoading"
      style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-top: 5px;"
    >
      <option value="" disabled *ngIf="availableModels.length === 0">No models loaded. Fetch models first.</option>
      <option *ngFor="let model of availableModels" [value]="model.id">
        {{ model.id }}
      </option>
    </select>
  </div>
  
  <hr style="margin-top: 30px;">

  <h2>AI Response</h2>
  <div style="border: 1px solid #eee; padding: 15px; min-height: 100px; background-color: #f9f9f9; white-space: pre-wrap; border-radius: 4px;">
    <div *ngIf="isLoading; else showResponse">
      <p style="color: #007bff;">Generating response... </p>
    </div>
    <ng-template #showResponse>
      {{ responseContent }}
    </ng-template>
  </div>

  <hr>

  <h2>Your Message</h2>
  <textarea 
    [(ngModel)]="userInput" 
    placeholder="Type your message here..." 
    rows="4" 
    style="width: 100%; margin-bottom: 10px; padding: 10px; border: 1px solid #ccc; border-radius: 4px;"
    (keyup.enter)="sendMessage()"
    [disabled]="isLoading || availableModels.length === 0"
  ></textarea>

  <!-- 🛑 Button is now disabled if ANY of the four required fields are missing -->
  <button 
    (click)="sendMessage()" 
    [disabled]="!userInput.trim() || !apiKey.trim() || !apiUrl.trim() || !selectedModel.trim() || isLoading" 
    style="background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; transition: background-color 0.3s;"
    onmouseover="this.style.backgroundColor='#1e7e34'"
    onmouseout="this.style.backgroundColor='#28a745'">
    Send Chat Request
  </button>
  
  <p *ngIf="isLoading" style="color: #28a745; margin-top: 10px;">Sending request...</p>
</div>
